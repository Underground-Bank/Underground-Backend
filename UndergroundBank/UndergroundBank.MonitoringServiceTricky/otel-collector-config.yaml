receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch: {}

exporters:
  # трейсинг → Tempo
  otlp/tempo:
    endpoint: "tempo:4317"
    tls:
      insecure: true

  # логгинг → Loki
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"

  # метрики → Prometheus
  prometheus:
    endpoint: "0.0.0.0:9464"

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [otlp/tempo]

    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [prometheus]

    logs:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [loki]
